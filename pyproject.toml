[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hustleai"
version = "0.1.0"
description = "Owner-controlled Zoho workflows and Hermes MCP tools"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30.0,<2", "certifi>=2026.7.22"]

[project.optional-dependencies]
bank = ["pdfplumber>=0.11.10,<0.12"]
postgres = ["psycopg[binary]>=3.3.6,<4"]
hermes = ["pyyaml>=6.0.3,<7"]

[project.scripts]
hustleai-mcp = "hustleai.mcp.owner_server:main"
hustleai-contacts = "hustleai.cli.contacts:run"
hustleai-forecast = "hustleai.cli.forecast:run"
hustleai-orders = "hustleai.cli.orders:run"
hustleai-whatsapp = "hustleai.cli.whatsapp:run"
hustleai-tenant = "hustleai.cli.tenant:run"
hustleai-dashboard = "hustleai.dashboard.server:main"

hustleai-zoho-setup = "hustleai.cli.setup:run"
hustleai-zoho-upgrade = "hustleai.cli.upgrade:run"

[project.entry-points."hermes_agent.plugins"]
hustleai = "hustleai.hermes:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hustleai.hermes" = ["plugin.yaml", "skills/*/SKILL.md", "profile/*.tmpl", "scripts/*.tmpl"]
"hustleai.dashboard" = ["static/*.html", "static/*.css", "static/*.js"]
