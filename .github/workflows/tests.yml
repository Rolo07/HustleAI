# Runs the unit and MCP integration tests on every push and pull request.
# Tests use fake Zoho data and temporary storage: no secrets, no network writes.
# The opt-in PostgreSQL suite stays skipped because HUSTLEAI_TEST_POSTGRES is unset.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install audited tooling
        run: python -m pip install -c requirements-lock.txt --upgrade pip setuptools
      - name: Install package with audited constraints
        run: python -m pip install --no-build-isolation -c requirements-lock.txt -e '.[bank,postgres,hermes]'
      - name: Check package consistency
        run: python -m pip check
      - name: Run tests
        run: python -m unittest discover -s tests -v
