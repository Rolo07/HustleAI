# Runs the unit and MCP integration tests on every push and pull request.
# Tests use fake Zoho data and temporary storage: no secrets, no network writes.
# The opt-in PostgreSQL suite stays skipped because HUSTLEAI_TEST_POSTGRES is unset.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[postgres,hermes]'
      - name: Run tests
        run: python -m unittest discover -s tests -v
