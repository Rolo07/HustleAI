<polyline points="437,703.0 346,703.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="363.0" y="678.0" width="57.0" height="24" rx="6" fill="white"/><text x="391.5" y="694.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#334155">Prices</text>
<polyline points="723,703.0 814,703.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="743.75" y="678.0" width="49.5" height="24" rx="6" fill="white"/><text x="768.5" y="694.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#334155">Order</text>
<g><title>New enquiry candidate: Use verified sender number</title><rect x="437" y="36" width="286" height="86" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.3"/>
<text x="580.0" y="67" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">New enquiry candidate</text>
<text x="580.0" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Use verified sender number</text>
</g>
<g><title>Existing or unclear match?: Check before onboarding</title><rect x="437" y="192" width="286" height="86" rx="22" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
<text x="580.0" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Existing or unclear match?</text>
<text x="580.0" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Check before onboarding</text>
</g>
<g><title>Route or refer: Do not create a duplicate identity</title><rect x="60" y="192" width="286" height="86" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
<text x="203.0" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Route or refer</text>
<text x="203.0" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Do not create a duplicate identity</text>
</g>
<g><title>Name already supplied?: Reuse conversation details</title><rect x="437" y="348" width="286" height="86" rx="22" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
<text x="580.0" y="379" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Name already supplied?</text>
<text x="580.0" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Reuse conversation details</text>
</g>
<g><title>Ask for their name: Wait for customer reply</title><rect x="814" y="348" width="286" height="86" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
<text x="957.0" y="379" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Ask for their name</text>
<text x="957.0" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Wait for customer reply</text>
</g>
<g><title>Save name locally: No automatic Zoho creation</title><rect x="437" y="504" width="286" height="86" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
<text x="580.0" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Save name locally</text>
<text x="580.0" y="564" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">No automatic Zoho creation</text>
</g>
<g><title>Acknowledge enquiry: No order capture in this phase</title><rect x="437" y="660" width="286" height="86" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
<text x="580.0" y="691" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Acknowledge enquiry</text>
<text x="580.0" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">No order capture in this phase</text>
</g>
<g><title>Add to daily summary: Include pending name requests</title><rect x="437" y="816" width="286" height="86" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
<text x="580.0" y="847" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Add to daily summary</text>
<text x="580.0" y="876" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Include pending name requests</text>
</g>
<g><title>Price list requested?: Run PDF flow independently</title><rect x="60" y="660" width="286" height="86" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
<text x="203.0" y="691" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Price list requested?</text>
<text x="203.0" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Run PDF flow independently</text>
</g>
<g><title>Wants to place an order?: Refer to Roland immediately</title><rect x="814" y="660" width="286" height="86" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
<text x="957.0" y="691" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Wants to place an order?</text>
<text x="957.0" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Refer to Roland immediately</text>
</g>
</svg>