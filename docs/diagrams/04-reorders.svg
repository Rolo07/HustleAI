<g><title>Show order proposal: Items, quantities and current total</title><rect x="437" y="504" width="286" height="86" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
<text x="580.0" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Show order proposal</text>
<text x="580.0" y="564" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Items, quantities and current total</text>
</g>
<g><title>Customer confirms?: Confirmation binds order version</title><rect x="437" y="660" width="286" height="86" rx="22" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
<text x="580.0" y="691" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Customer confirms?</text>
<text x="580.0" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Confirmation binds order version</text>
</g>
<g><title>Revise order proposal: Recalculate and show again</title><rect x="60" y="660" width="286" height="86" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
<text x="203.0" y="691" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Revise order proposal</text>
<text x="203.0" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Recalculate and show again</text>
</g>
<g><title>Unclear response: Refer immediately</title><rect x="814" y="660" width="286" height="86" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
<text x="957.0" y="691" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Unclear response</text>
<text x="957.0" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Refer immediately</text>
</g>
<g><title>Create draft once: ZAR; due in seven days; unsent</title><rect x="437" y="816" width="286" height="86" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
<text x="580.0" y="847" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Create draft once</text>
<text x="580.0" y="876" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">ZAR; due in seven days; unsent</text>
</g>
