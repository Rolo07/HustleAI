<text x="203.0" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Refer to Roland</text>
<text x="203.0" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Missing or ambiguous records</text>
</g>
<g><title>Products and pricing clear?: Validate availability and tax</title><rect x="437" y="348" width="286" height="86" rx="22" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
<text x="580.0" y="379" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Products and pricing clear?</text>
<text x="580.0" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Validate availability and tax</text>
</g>
<g><title>Refer to Roland: No guessed prices or taxes</title><rect x="814" y="348" width="286" height="86" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
<text x="957.0" y="379" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Refer to Roland</text>
<text x="957.0" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">No guessed prices or taxes</text>
