<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 788" role="img" aria-labelledby="title desc">
<title id="title">Owner review &amp; revisions</title><desc id="desc">Directed workflow diagram. Follow arrows and branch labels. Decisions have amber borders; Roland actions are purple; exceptions are red.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<polyline points="580.0,122 580.0,192" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="723,235.0 814,235.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="736.25" y="210.0" width="64.5" height="24" rx="6" fill="white"/><text x="768.5" y="226.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#334155">Unclear</text>
<polyline points="437,235.0 391.5,235.0 391.5,391.0 346,391.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="359.25" y="301.0" width="64.5" height="24" rx="6" fill="white"/><text x="391.5" y="317.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#334155">Changes</text>
<polyline points="203.0,434 203.0,504" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="60,547.0 20,547.0 20,79.0 437,79.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="25.25" y="301.0" width="79.5" height="24" rx="6" fill="white"/><text x="65" y="317.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#334155">Re-review</text>
<polyline points="580.0,278 580.0,348" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="547.75" y="301.0" width="64.5" height="24" rx="6" fill="white"/><text x="580.0" y="317.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#334155">Approve</text>
<polyline points="580.0,434 580.0,504" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="723,547.0 814,547.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="751.5" y="522.0" width="34" height="24" rx="6" fill="white"/><text x="768.5" y="538.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#334155">No</text>
<polyline points="1100,547.0 1140,547.0 1140,79.0 723,79.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1055.25" y="301.0" width="79.5" height="24" rx="6" fill="white"/><text x="1095" y="317.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#334155">Re-review</text>
<polyline points="580.0,590 580.0,660" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="562.75" y="613.0" width="34.5" height="24" rx="6" fill="white"/><text x="580.0" y="629.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#334155">Yes</text>
<g><title>Send draft PDF to Roland: Include invoice ID and version</title><rect x="437" y="36" width="286" height="86" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="580.0" y="67" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Send draft PDF to Roland</text>
<text x="580.0" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Include invoice ID and version</text>
</g>
<g><title>Roland’s response?: Verified owner conversation only</title><rect x="437" y="192" width="286" height="86" rx="22" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
<text x="580.0" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Roland’s response?</text>
<text x="580.0" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Verified owner conversation only</text>
</g>
<g><title>Ask for clarification: Ambiguous invoice or instruction</title><rect x="814" y="192" width="286" height="86" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
<text x="957.0" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Ask for clarification</text>
<text x="957.0" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Ambiguous invoice or instruction</text>
</g>
<g><title>Apply requested changes: Update the same draft</title><rect x="60" y="348" width="286" height="86" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
<text x="203.0" y="379" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Apply requested changes</text>
<text x="203.0" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Update the same draft</text>
</g>
<g><title>New version and PDF: Invalidate all earlier approval</title><rect x="60" y="504" width="286" height="86" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
<text x="203.0" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">New version and PDF</text>
<text x="203.0" y="564" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Invalidate all earlier approval</text>
</g>
<g><title>Approve current version: Bind recipient and content</title><rect x="437" y="348" width="286" height="86" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
<text x="580.0" y="379" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Approve current version</text>
<text x="580.0" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Bind recipient and content</text>
</g>
<g><title>Still the same invoice?: Recheck external Zoho edits</title><rect x="437" y="504" width="286" height="86" rx="22" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
<text x="580.0" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Still the same invoice?</text>
<text x="580.0" y="564" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Recheck external Zoho edits</text>
</g>
<g><title>Content changed: New preview and approval needed</title><rect x="814" y="504" width="286" height="86" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
<text x="957.0" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Content changed</text>
<text x="957.0" y="564" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">New preview and approval needed</text>
</g>
<g><title>Hand off for delivery: Only exact approved version</title><rect x="437" y="660" width="286" height="86" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
<text x="580.0" y="691" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Hand off for delivery</text>
<text x="580.0" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Only exact approved version</text>
</g>
</svg>