</g>
<g><title>Refer to Roland: Do not invent a replacement</title><rect x="60" y="192" width="286" height="86" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
<text x="203.0" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Refer to Roland</text>
<text x="203.0" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Do not invent a replacement</text>
</g>
