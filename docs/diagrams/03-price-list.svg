<g><title>Customer asks for prices: New or existing customer</title><rect x="437" y="36" width="286" height="86" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.3"/>
<text x="580.0" y="67" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Customer asks for prices</text>
<text x="580.0" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">New or existing customer</text>
</g>
<g><title>Approved PDF available?: Configured VPS path; valid PDF</title><rect x="437" y="192" width="286" height="86" rx="22" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
<text x="580.0" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Approved PDF available?</text>
